<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        header {
            background: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.02);
        }

        .title {
            font-weight: bold;
            color: #333;
        }

        .desc {
            margin-top: 5px;
            color: #555;
        }

        .index {
            color: #888;
            font-size: 12px;
        }

        .empty {
            text-align: center;
            color: gray;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<header>📊 Admin Dashboard - Complaints</header>

<div class="container" id="container"></div>

<script>
    fetch("/complaints")
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById("container");

            if (data.length === 0) {
                container.innerHTML = "<p class='empty'>No complaints found 😴</p>";
                return;
            }

            data.forEach((item, index) => {
                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                    <div class="index">Complaint #${index + 1}</div>
                    <div class="title">Name: ${item.name || "N/A"}</div>
                    <div class="desc">Issue: ${item.message || "No description"}</div>
                `;

                container.appendChild(card);
            });
        })
        .catch(err => {
            document.getElementById("container").innerHTML =
                "<p class='empty'>Error loading data ❌</p>";
            console.error(err);
        });
</script>

</body>
</html>
